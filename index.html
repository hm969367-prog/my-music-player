<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TILLU - Spotify Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 230px; background-color: #121212; padding: 22px; display: flex; flex-direction: column; gap: 24px; border-right: 1px solid #222; }
        .logo { color: #ff0055; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #1db954; font-size: 26px; }
        .nav-items { display: flex; flex-direction: column; gap: 14px; }
        .nav-item { color: #b3b3b3; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: #ff0055; }

        /* Main Content */
        .main-content { flex: 1; background: linear-gradient(180deg, #220e1e 0%, #0b0b0b 100%); overflow-y: auto; padding: 24px 30px; }
        
        .genre-chips { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
        .chip { background: #1e1e1e; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #333; white-space: nowrap; transition: 0.2s; }
        .chip:hover, .chip.active { background: #ff0055; border-color: #ff0055; }

        h2 { font-size: 22px; margin-bottom: 16px; font-weight: 700; color: #fff; }
        
        /* Spotify Player Box */
        .player-container { background: #181818; border-radius: 12px; padding: 16px; border: 1px solid #282828; max-width: 900px; }
        iframe { width: 100%; height: 450px; border-radius: 12px; border: none; }

        @media(max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding: 16px; }
            iframe { height: 380px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-compact-disc"></i> DJ TILLU</div>
        <div class="nav-items">
            <div class="nav-item active" onclick="loadSpotify('haryanvi')"><i class="fa-solid fa-fire"></i> Haryanvi Non-Stop</div>
            <div class="nav-item" onclick="loadSpotify('punjabi')"><i class="fa-solid fa-bolt"></i> Punjabi Hits</div>
            <div class="nav-item" onclick="loadSpotify('bollywood')"><i class="fa-solid fa-heart"></i> Bollywood Hits</div>
            <div class="nav-item" onclick="loadSpotify('moosewala')"><i class="fa-solid fa-crown"></i> Sidhu Moose Wala</div>
        </div>
    </div>

    <div class="main-content">
        <div class="genre-chips">
            <button class="chip active" onclick="loadSpotify('haryanvi')">🔥 Haryanvi Hits</button>
            <button class="chip" onclick="loadSpotify('punjabi')">⚡ Punjabi Beats</button>
            <button class="chip" onclick="loadSpotify('bollywood')">❤️ Bollywood Trending</button>
            <button class="chip" onclick="loadSpotify('moosewala')">👑 Sidhu Moose Wala</button>
            <button class="chip" onclick="loadSpotify('honey')">🎧 Honey Singh Hits</button>
        </div>

        <h2 id="sectionTitle">Official Haryanvi Playlist</h2>

        <div class="player-container">
            <iframe id="spotifyPlayer" 
                    src="https://open.spotify.com/embed/playlist/37i9dQZF1DWXepVyUtRiqE?utm_source=generator&theme=0" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
            </iframe>
        </div>
    </div>

    <script>
        // Official Verified Spotify Playlist IDs (Direct Integration)
        const spotifyPlaylists = {
            haryanvi: {
                title: "Official Haryanvi Playlist",
                url: "https://open.spotify.com/embed/playlist/37i9dQZF1DWXepVyUtRiqE?utm_source=generator&theme=0"
            },
            punjabi: {
                title: "Punjabi 101 - Top Bangers",
                url: "https://open.spotify.com/embed/playlist/37i9dQZF1DX5cZuAhlNjGz?utm_source=generator&theme=0"
            },
            bollywood: {
                title: "Bollywood Mega Hits",
                url: "https://open.spotify.com/embed/playlist/37i9dQZF1DX0XUfTFmZeM0?utm_source=generator&theme=0"
            },
            moosewala: {
                title: "Best of Sidhu Moose Wala",
                url: "https://open.spotify.com/embed/artist/4PULA4EFzYTrxYvOVYywDX?utm_source=generator&theme=0"
            },
            honey: {
                title: "Best of Yo Yo Honey Singh",
                url: "https://open.spotify.com/embed/artist/7uIbLdzzVZQIxfUpUpTwBj?utm_source=generator&theme=0"
            }
        };

        function loadSpotify(category) {
            const data = spotifyPlaylists[category];
            if (!data) return;

            document.getElementById('sectionTitle').innerText = data.title;
            document.getElementById('spotifyPlayer').src = data.url;

            // Highlight active button
            const chips = document.querySelectorAll('.chip');
            chips.forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
