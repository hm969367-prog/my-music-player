<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TILLU - Live Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0c0c0c; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 230px; background-color: #121212; padding: 22px; display: flex; flex-direction: column; gap: 24px; border-right: 1px solid #222; }
        .logo { color: #ff0055; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #1db954; font-size: 26px; }
        .nav-items { display: flex; flex-direction: column; gap: 14px; }
        .nav-item { color: #b3b3b3; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: #ff0055; }

        /* Main Content */
        .main-content { flex: 1; background: linear-gradient(180deg, #1c0e1e 0%, #0c0c0c 100%); overflow-y: auto; padding: 20px 28px 120px 28px; }
        
        .topbar { display: flex; gap: 12px; margin-bottom: 22px; }
        .search-box { display: flex; align-items: center; background: #222; border-radius: 500px; padding: 10px 18px; width: 100%; max-width: 440px; border: 1px solid #333; }
        .search-box:focus-within { border-color: #ff0055; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; margin-left: 10px; width: 100%; font-size: 14px; }
        .btn-search { background: #ff0055; border: none; color: #fff; font-weight: bold; padding: 10px 22px; border-radius: 500px; cursor: pointer; transition: 0.2s; }
        .btn-search:hover { background: #e6004c; }

        .genre-chips { display: flex; gap: 10px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 4px; }
        .chip { background: #1e1e1e; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #333; white-space: nowrap; transition: 0.2s; }
        .chip:hover, .chip.active { background: #ff0055; border-color: #ff0055; }

        h2 { font-size: 20px; margin-bottom: 16px; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; }
        
        .card { background-color: #161616; padding: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; border: 1px solid #222; }
        .card:hover { background-color: #222; transform: translateY(-3px); }
        .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-artist { font-size: 11px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .play-btn { position: absolute; right: 20px; bottom: 65px; width: 40px; height: 40px; border-radius: 50%; background-color: #ff0055; display: flex; justify-content: center; align-items: center; opacity: 0; transform: translateY(6px); transition: 0.2s; }
        .play-btn i { color: #fff; font-size: 14px; margin-left: 2px; }
        .card:hover .play-btn { opacity: 1; transform: translateY(0); }

        /* Embedded Player Screen in Bottom Bar */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 95px; background-color: #121212; border-top: 1px solid #222; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        
        .current-track { display: flex; align-items: center; gap: 12px; width: 35%; }
        .video-box { width: 85px; height: 55px; border-radius: 6px; overflow: hidden; background: #000; flex-shrink: 0; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .track-info .track-name { font-size: 13px; font-weight: 600; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info .artist-name { font-size: 11px; color: #b3b3b3; margin-top: 2px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-center { display: flex; align-items: center; gap: 20px; width: 30%; justify-content: center; }
        .control-btns { display: flex; align-items: center; gap: 24px; }
        .control-btns i { color: #b3b3b3; font-size: 22px; cursor: pointer; transition: 0.2s; }
        .control-btns i:hover { color: #ff0055; }

        .extra-controls { width: 35%; display: flex; justify-content: flex-end; align-items: center; color: #1db954; font-size: 12px; font-weight: 600; }

        @media(max-width: 768px) {
            .sidebar { display: none; }
            .player-bar { height: 80px; padding: 0 10px; }
            .extra-controls { display: none; }
            .current-track { width: 60%; }
            .player-center { width: 40%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-compact-disc"></i> DJ TILLU</div>
        <div class="nav-items">
            <div class="nav-item active" onclick="loadCategory('haryanvi')"><i class="fa-solid fa-fire"></i> Haryanvi Nonstop</div>
            <div class="nav-item" onclick="loadCategory('punjabi')"><i class="fa-solid fa-bolt"></i> Punjabi Hits</div>
            <div class="nav-item" onclick="loadCategory('bollywood')"><i class="fa-solid fa-heart"></i> Bollywood 90s & Hits</div>
            <div class="nav-item" onclick="loadCategory('moosewala')"><i class="fa-solid fa-crown"></i> Sidhu Moose Wala</div>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #b3b3b3;"></i>
                <input type="text" id="searchInput" placeholder="Search track name or paste YouTube URL..." onkeypress="if(event.key==='Enter') searchMusic()">
            </div>
            <button class="btn-search" onclick="searchMusic()">Play</button>
        </div>

        <div class="genre-chips">
            <button class="chip active" onclick="loadCategory('haryanvi')">Haryanvi Top Hits</button>
            <button class="chip" onclick="loadCategory('punjabi')">Punjabi Bangers</button>
            <button class="chip" onclick="loadCategory('bollywood')">Bollywood Romantic</button>
            <button class="chip" onclick="loadCategory('moosewala')">Sidhu Moose Wala</button>
        </div>

        <h2 id="sectionTitle">Trending Tracks</h2>
        <div class="grid" id="songsGrid"></div>
    </div>

    <!-- Bottom Player -->
    <div class="player-bar">
        <div class="current-track">
            <div class="video-box">
                <iframe id="mainPlayer" src="https://www.youtube.com/embed/jZ_yP61t94A?enablejsapi=1" allow="autoplay"></iframe>
            </div>
            <div class="track-info">
                <div class="track-name" id="currentTitle">Select a Track</div>
                <div class="artist-name" id="currentArtist">DJ TILLU Online Player</div>
            </div>
        </div>

        <div class="player-center">
            <div class="control-btns">
                <i class="fa-solid fa-backward-step" onclick="prevSong()" title="Previous"></i>
                <i class="fa-solid fa-forward-step" onclick="nextSong()" title="Next"></i>
            </div>
        </div>

        <div class="extra-controls">
            <span>● 100% Full Audio Playing</span>
        </div>
    </div>

    <script>
        // High Quality Direct YouTube Songs with Official Thumbnails
        const songLibrary = {
            haryanvi: [
                { id: "JzK3_1_Kq6A", title: "Kaleshi Chori", artist: "Pranjal Dahiya, DG Immortals" },
                { id: "zHjC1m8K7rU", title: "Gypsy (Balam Thanedhar)", artist: "GD Kaur, Pranjal Dahiya" },
                { id: "vX2v7Ul8rJQ", title: "Dada Pota", artist: "Gulzaar Chhaniwala" },
                { id: "5y_9A_Nq34Y", title: "2 Numbari", artist: "Masoom Sharma" },
                { id: "tV9zV1mKx98", title: "Moto", artist: "Diler Kharkiya" },
                { id: "w6T5f8a0m21", title: "Badmashi", artist: "Masoom Sharma" }
            ],
            punjabi: [
                { id: "kXYiU_JCYtU", title: "295", artist: "Sidhu Moose Wala" },
                { id: "7r1Uv5f4T44", title: "The Last Ride", artist: "Sidhu Moose Wala" },
                { id: "JGwWNGJdvx8", title: "So High", artist: "Sidhu Moose Wala, BYG BYRD" },
                { id: "T1e0U2qfS44", title: "Same Beef", artist: "Sidhu Moose Wala, Bohemia" },
                { id: "fJ9rUzIMcZQ", title: "Desi Kalakaar", artist: "Yo Yo Honey Singh" }
            ],
            bollywood: [
                { id: "JGwWNGJdvx8", title: "Chaleya", artist: "Arijit Singh, Anirudh" },
                { id: "T1e0U2qfS44", title: "O Maahi", artist: "Arijit Singh, Pritam" },
                { id: "kJQP7kiw5Fk", title: "Apna Bana Le", artist: "Arijit Singh, Sachin-Jigar" },
                { id: "09R8_2nJtjg", title: "Tum Hi Ho", artist: "Arijit Singh" }
            ],
            moosewala: [
                { id: "kXYiU_JCYtU", title: "295 (Official)", artist: "Sidhu Moose Wala" },
                { id: "7r1Uv5f4T44", title: "The Last Ride", artist: "Sidhu Moose Wala" },
                { id: "JGwWNGJdvx8", title: "So High", artist: "Sidhu Moose Wala" }
            ]
        };

        let currentList = songLibrary.haryanvi;
        let currentIndex = 0;

        window.onload = () => {
            loadCategory('haryanvi');
        };

        function loadCategory(cat) {
            currentList = songLibrary[cat] || songLibrary.haryanvi;
            document.getElementById('sectionTitle').innerText = `${cat.toUpperCase()} Hits`;
            renderGrid(currentList);
        }

        function renderGrid(songs) {
            const grid = document.getElementById('songsGrid');
            grid.innerHTML = '';

            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playSong(index);

                // Direct YouTube Official Thumbnail Link
                const thumbUrl = `https://img.youtube.com/vi/${song.id}/mqdefault.jpg`;

                card.innerHTML = `
                    <img src="${thumbUrl}" alt="Thumbnail">
                    <div class="play-btn"><i class="fa-solid fa-play"></i></div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-artist">${song.artist}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playSong(index) {
            currentIndex = index;
            const song = currentList[index];
            if (!song) return;

            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;

            // Direct iframe autoplay load
            const iframe = document.getElementById('mainPlayer');
            iframe.src = `https://www.youtube.com/embed/${song.id}?autoplay=1`;
        }

        function nextSong() {
            if (currentIndex < currentList.length - 1) {
                playSong(currentIndex + 1);
            } else {
                playSong(0);
            }
        }

        function prevSong() {
            if (currentIndex > 0) {
                playSong(currentIndex - 1);
            }
        }

        function searchMusic() {
            const input = document.getElementById('searchInput').value.trim();
            if (!input) return;

            // Extract YouTube ID if link pasted
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            const videoId = (match && match[2].length === 11) ? match[2] : input;

            document.getElementById('currentTitle').innerText = "Playing Custom Track";
            document.getElementById('currentArtist').innerText = input;

            const iframe = document.getElementById('mainPlayer');
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            document.getElementById('searchInput').value = '';
        }
    </script>
</body>
</html>
