<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TILLU - Live Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0c0c0c; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }

        /* Navbar */
        .navbar { background: #121212; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .logo { color: #ff0055; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #1db954; font-size: 26px; }

        /* Category Buttons */
        .categories { display: flex; gap: 10px; padding: 20px 24px 10px 24px; overflow-x: auto; }
        .chip { background: #1e1e1e; color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #333; white-space: nowrap; transition: 0.2s; }
        .chip:hover, .chip.active { background: #ff0055; border-color: #ff0055; }

        /* Main Container */
        .content { flex: 1; padding: 10px 24px 40px 24px; max-width: 900px; margin: 0 auto; width: 100%; }
        h2 { font-size: 20px; margin-bottom: 14px; font-weight: 700; }

        /* Spotify Player Box */
        .player-wrap { background: #181818; border-radius: 16px; padding: 16px; border: 1px solid #282828; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        iframe { width: 100%; height: 460px; border-radius: 12px; border: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-compact-disc"></i> DJ TILLU</div>
    </div>

    <div class="categories">
        <button class="chip active" onclick="loadSection('haryanvi', this)">🔥 Haryanvi Hits</button>
        <button class="chip" onclick="loadSection('punjabi', this)">⚡ Punjabi Bangers</button>
        <button class="chip" onclick="loadSection('bollywood', this)">❤️ Bollywood Evergreen</button>
        <button class="chip" onclick="loadSection('sidhu', this)">👑 Sidhu Moose Wala</button>
    </div>

    <div class="content">
        <h2 id="heading">Trending Haryanvi Songs</h2>
        <div class="player-wrap">
            <iframe id="mainEmbed" 
                    src="https://open.spotify.com/embed/playlist/37i9dQZF1DWXepVyUtRiqE?utm_source=generator&theme=0" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                    loading="lazy">
            </iframe>
        </div>
    </div>

    <script>
        const playlists = {
            haryanvi: {
                title: "Trending Haryanvi Songs",
                url: "https://open.spotify.com/embed/playlist/37i9dQZF1DWXepVyUtRiqE?utm_source=generator&theme=0"
            },
            punjabi: {
                title: "Punjabi Top Hits",
                url: "https://open.spotify.com/embed/playlist/37i9dQZF1DX4t95Pao28ew?utm_source=generator&theme=0"
            },
            bollywood: {
                title: "Evergreen Bollywood Hits",
                url: "https://open.spotify.com/embed/playlist/37i9dQZF1DX0XUfTFmZeM0?utm_source=generator&theme=0"
            },
            sidhu: {
                title: "Sidhu Moose Wala All Hits",
                url: "https://open.spotify.com/embed/artist/4PULA4EFzYTrxYvOVYywDX?utm_source=generator&theme=0"
            }
        };

        function loadSection(type, btn) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');

            const item = playlists[type];
            document.getElementById('heading').innerText = item.title;
            document.getElementById('mainEmbed').src = item.url;
        }
    </script>
</body>
</html>
