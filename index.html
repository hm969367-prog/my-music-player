<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TILLU - Official Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 230px; background-color: #111; padding: 24px; display: flex; flex-direction: column; gap: 24px; border-right: 1px solid #222; }
        .logo { color: #ff0055; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; letter-spacing: 1px; }
        .logo i { color: #1db954; font-size: 26px; }
        .nav-items { display: flex; flex-direction: column; gap: 16px; }
        .nav-item { color: #b3b3b3; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: #ff0055; }

        /* Main Content */
        .main-content { flex: 1; background: linear-gradient(180deg, #1f1424 0%, #0d0d0d 100%); overflow-y: auto; padding: 20px 30px 120px 30px; }
        
        .topbar { display: flex; gap: 12px; margin-bottom: 24px; }
        .search-box { display: flex; align-items: center; background: #222; border-radius: 500px; padding: 10px 18px; width: 100%; max-width: 450px; border: 1px solid #333; }
        .search-box:focus-within { border-color: #ff0055; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; margin-left: 10px; width: 100%; font-size: 14px; }
        .btn-search { background: #ff0055; border: none; color: #fff; font-weight: bold; padding: 10px 24px; border-radius: 500px; cursor: pointer; transition: 0.2s; }
        .btn-search:hover { transform: scale(1.04); background: #e6004c; }

        .genre-chips { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 5px; }
        .chip { background: #222; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #333; transition: 0.2s; white-space: nowrap; }
        .chip:hover, .chip.active { background: #ff0055; border-color: #ff0055; color: #fff; }

        h2 { font-size: 22px; margin-bottom: 16px; font-weight: 700; color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        
        .card { background-color: #161616; padding: 16px; border-radius: 10px; cursor: pointer; transition: 0.2s; position: relative; border: 1px solid #222; }
        .card:hover { background-color: #242424; transform: translateY(-4px); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-artist { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .play-btn { position: absolute; right: 24px; bottom: 75px; width: 44px; height: 44px; border-radius: 50%; background-color: #ff0055; display: flex; justify-content: center; align-items: center; opacity: 0; transform: translateY(6px); transition: 0.2s; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .play-btn i { color: #fff; font-size: 16px; margin-left: 2px; }
        .card:hover .play-btn { opacity: 1; transform: translateY(0); }

        /* Mini Video Display in player */
        .video-box { width: 64px; height: 64px; border-radius: 6px; overflow: hidden; background: #000; flex-shrink: 0; }
        #player { width: 100%; height: 100%; }

        /* Bottom Player Bar */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background-color: #111; border-top: 1px solid #222; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; }
        
        .current-track { display: flex; align-items: center; gap: 14px; width: 30%; }
        .track-info .track-name { font-size: 14px; font-weight: 600; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info .artist-name { font-size: 12px; color: #b3b3b3; margin-top: 2px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 40%; }
        .control-btns { display: flex; align-items: center; gap: 22px; }
        .control-btns i { color: #b3b3b3; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .control-btns i:hover { color: #ff0055; }
        .play-toggle { width: 38px; height: 38px; border-radius: 50%; background-color: #ff0055; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .play-toggle i { color: #fff !important; font-size: 14px !important; }

        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: #a7a7a7; }
        .progress-bar { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #333; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #ff0055; cursor: pointer; }

        .extra-controls { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 12px; color: #b3b3b3; font-size: 13px; }

        @media(max-width: 768px) {
            .sidebar { display: none; }
            .player-bar { height: 75px; padding: 0 12px; }
            .extra-controls { display: none; }
            .current-track { width: 50%; }
            .player-center { width: 50%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-compact-disc"></i> DJ TILLU</div>
        <div class="nav-items">
            <div class="nav-item active" onclick="loadCategory('Haryanvi Hits')"><i class="fa-solid fa-fire"></i> Trending</div>
            <div class="nav-item" onclick="loadCategory('Bollywood Romantic')"><i class="fa-solid fa-heart"></i> Bollywood</div>
            <div class="nav-item" onclick="loadCategory('Sidhu Moose Wala')"><i class="fa-solid fa-bolt"></i> Punjabi</div>
            <div class="nav-item" onclick="loadCategory('Masoom Sharma')"><i class="fa-solid fa-music"></i> Haryanvi</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="topbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #b3b3b3;"></i>
                <input type="text" id="searchInput" placeholder="Search any song, artist name or paste YT link..." onkeypress="handleKey(event)">
            </div>
            <button class="btn-search" onclick="searchMusic()">Search</button>
        </div>

        <div class="genre-chips">
            <button class="chip active" onclick="loadCategory('Haryanvi Hits')">Haryanvi Non-Stop</button>
            <button class="chip" onclick="loadCategory('Sidhu Moose Wala')">Sidhu Moose Wala</button>
            <button class="chip" onclick="loadCategory('Arijit Singh')">Arijit Singh</button>
            <button class="chip" onclick="loadCategory('Gulzaar Chhaniwala')">Gulzaar Chhaniwala</button>
            <button class="chip" onclick="loadCategory('Honey Singh')">Honey Singh</button>
        </div>

        <h2 id="sectionTitle">Trending Tracks</h2>
        <div class="grid" id="songsGrid"></div>
    </div>

    <!-- Bottom Player -->
    <div class="player-bar">
        <div class="current-track">
            <div class="video-box">
                <div id="player"></div>
            </div>
            <div class="track-info">
                <div class="track-name" id="currentTitle">DJ TILLU Player</div>
                <div class="artist-name" id="currentArtist">Select a song</div>
            </div>
        </div>

        <div class="player-center">
            <div class="control-btns">
                <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
                <div class="play-toggle" onclick="togglePlay()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </div>
                <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" onchange="seekSong(this.value)">
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <span><i class="fa-solid fa-bolt"></i> Full Length</span>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Default Ready-to-Play Indian Collections
        const database = {
            'Haryanvi Hits': [
                { id: "JzK3_1_Kq6A", title: "Kaleshi Chori", artist: "Pranjal Dahiya, DG Immortals", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" },
                { id: "Qz1m8V5V1s8", title: "Gypsy (Balam Thanedhar)", artist: "GD Kaur, Pranjal Dahiya", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" },
                { id: "8u1E1yN4m38", title: "Dada Pota", artist: "Gulzaar Chhaniwala", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" },
                { id: "fJ9rUzIMcZQ", title: "2 Numbari", artist: "Masoom Sharma", cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=300" },
                { id: "p0Z5rP8R9S0", title: "Moto", artist: "Diler Kharkiya", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300" },
                { id: "kXYiU_JCYtU", title: "Badmashi", artist: "Masoom Sharma", cover: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300" }
            ],
            'Sidhu Moose Wala': [
                { id: "kXYiU_JCYtU", title: "295", artist: "Sidhu Moose Wala", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" },
                { id: "7r1Uv5f4T44", title: "The Last Ride", artist: "Sidhu Moose Wala", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" },
                { id: "JGwWNGJdvx8", title: "So High", artist: "Sidhu Moose Wala, BYG BYRD", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" },
                { id: "T1e0U2qfS44", title: "Same Beef", artist: "Sidhu Moose Wala, Bohemia", cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=300" }
            ],
            'Arijit Singh': [
                { id: "JGwWNGJdvx8", title: "Chaleya (Jawan)", artist: "Arijit Singh, Shilpa Rao", cover: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300" },
                { id: "T1e0U2qfS44", title: "O Maahi (Dunki)", artist: "Arijit Singh, Pritam", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" },
                { id: "kJQP7kiw5Fk", title: "Apna Bana Le", artist: "Arijit Singh, Sachin-Jigar", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" }
            ]
        };

        let currentPlaylist = database['Haryanvi Hits'];
        let currentIndex = 0;
        let ytPlayer;
        let isPlaying = false;
        let progressInterval;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: currentPlaylist[0].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'playsinline': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
            renderGrid(currentPlaylist);
        }

        function renderGrid(songs) {
            const grid = document.getElementById('songsGrid');
            grid.innerHTML = '';
            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playSong(index);
                card.innerHTML = `
                    <img src="${song.cover}" alt="${song.title}">
                    <div class="play-btn"><i class="fa-solid fa-play"></i></div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-artist">${song.artist}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playSong(index) {
            currentIndex = index;
            const song = currentPlaylist[index];

            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;

            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(song.id);
            }
        }

        function togglePlay() {
            if (!ytPlayer) return;
            if (isPlaying) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        }

        function nextSong() {
            if (currentIndex < currentPlaylist.length - 1) {
                playSong(currentIndex + 1);
            } else {
                playSong(0);
            }
        }

        function prevSong() {
            if (currentIndex > 0) {
                playSong(currentIndex - 1);
            }
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('playIcon');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                startProgressBar();
            } else {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                clearInterval(progressInterval);
            }

            if (event.data === YT.PlayerState.ENDED) {
                nextSong();
            }
        }

        function startProgressBar() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (ytPlayer && ytPlayer.getCurrentTime) {
                    const current = ytPlayer.getCurrentTime();
                    const total = ytPlayer.getDuration();
                    if (total > 0) {
                        document.getElementById('progressBar').value = (current / total) * 100;
                        document.getElementById('currentTime').innerText = formatTime(current);
                        document.getElementById('totalDuration').innerText = formatTime(total);
                    }
                }
            }, 1000);
        }

        function seekSong(val) {
            if (ytPlayer && ytPlayer.getDuration) {
                const seekTo = (val / 100) * ytPlayer.getDuration();
                ytPlayer.seekTo(seekTo, true);
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function handleKey(e) {
            if (e.key === 'Enter') searchMusic();
        }

        function loadCategory(cat) {
            document.getElementById('sectionTitle').innerText = `${cat} Tracks`;
            if (database[cat]) {
                currentPlaylist = database[cat];
                renderGrid(currentPlaylist);
            } else {
                // If not in pre-list, simulate track
                currentPlaylist = database['Haryanvi Hits'];
                renderGrid(currentPlaylist);
            }
        }

        function searchMusic() {
            const input = document.getElementById('searchInput').value.trim();
            if (!input) return;

            // Direct link support or keyword
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            const videoId = (match && match[2].length === 11) ? match[2] : input;

            document.getElementById('currentTitle').innerText = input;
            document.getElementById('currentArtist').innerText = "Live Search";
            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(videoId);
            }
            document.getElementById('searchInput').value = '';
        }
    </script>
</body>
</html>
