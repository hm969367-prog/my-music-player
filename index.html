<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TILLU - Live Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0c0c0c; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 220px; background-color: #121212; padding: 20px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid #222; }
        .logo { color: #ff0055; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #1db954; font-size: 24px; }
        .nav-items { display: flex; flex-direction: column; gap: 14px; }
        .nav-item { color: #b3b3b3; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: #ff0055; }

        /* Main Content */
        .main-content { flex: 1; background: linear-gradient(180deg, #1c0f1d 0%, #0c0c0c 100%); overflow-y: auto; padding: 20px 24px 110px 24px; }
        
        .topbar { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-box { display: flex; align-items: center; background: #202020; border-radius: 500px; padding: 8px 16px; width: 100%; max-width: 400px; border: 1px solid #333; }
        .search-box:focus-within { border-color: #ff0055; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; margin-left: 8px; width: 100%; font-size: 14px; }
        .btn-search { background: #ff0055; border: none; color: #fff; font-weight: bold; padding: 8px 20px; border-radius: 500px; cursor: pointer; }
        .btn-search:hover { background: #e6004c; }

        .genre-chips { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
        .chip { background: #1e1e1e; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #333; white-space: nowrap; }
        .chip:hover, .chip.active { background: #ff0055; border-color: #ff0055; }

        h2 { font-size: 20px; margin-bottom: 14px; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        
        .card { background-color: #161616; padding: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; border: 1px solid #222; }
        .card:hover { background-color: #222; transform: translateY(-3px); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-artist { font-size: 11px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .play-btn { position: absolute; right: 20px; bottom: 65px; width: 40px; height: 40px; border-radius: 50%; background-color: #ff0055; display: flex; justify-content: center; align-items: center; opacity: 0; transform: translateY(6px); transition: 0.2s; }
        .play-btn i { color: #fff; font-size: 14px; margin-left: 2px; }
        .card:hover .play-btn { opacity: 1; transform: translateY(0); }

        /* Bottom Player */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; background-color: #121212; border-top: 1px solid #222; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        
        .current-track { display: flex; align-items: center; gap: 12px; width: 30%; }
        .current-track img { width: 50px; height: 50px; border-radius: 4px; object-fit: cover; }
        .track-info .track-name { font-size: 13px; font-weight: 600; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info .artist-name { font-size: 11px; color: #b3b3b3; margin-top: 2px; max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 40%; }
        .control-btns { display: flex; align-items: center; gap: 20px; }
        .control-btns i { color: #b3b3b3; font-size: 16px; cursor: pointer; }
        .control-btns i:hover { color: #ff0055; }
        .play-toggle { width: 34px; height: 34px; border-radius: 50%; background-color: #ff0055; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .play-toggle i { color: #fff !important; font-size: 13px !important; }

        .progress-container { width: 100%; display: flex; align-items: center; gap: 8px; font-size: 11px; color: #a7a7a7; }
        .progress-bar { flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px; background: #333; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #ff0055; cursor: pointer; }

        .extra-controls { width: 30%; display: flex; justify-content: flex-end; align-items: center; color: #1db954; font-size: 12px; font-weight: 600; }

        @media(max-width: 768px) {
            .sidebar { display: none; }
            .player-bar { height: 75px; padding: 0 10px; }
            .extra-controls { display: none; }
            .current-track { width: 50%; }
            .player-center { width: 50%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-compact-disc"></i> DJ TILLU</div>
        <div class="nav-items">
            <div class="nav-item active" onclick="loadQuery('Haryanvi')"><i class="fa-solid fa-fire"></i> Trending</div>
            <div class="nav-item" onclick="loadQuery('Arijit Singh')"><i class="fa-solid fa-heart"></i> Bollywood</div>
            <div class="nav-item" onclick="loadQuery('Sidhu Moose Wala')"><i class="fa-solid fa-bolt"></i> Punjabi</div>
            <div class="nav-item" onclick="loadQuery('Masoom Sharma')"><i class="fa-solid fa-music"></i> Haryanvi Hits</div>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #b3b3b3;"></i>
                <input type="text" id="searchInput" placeholder="Search any Hindi, Punjabi, Haryanvi song..." onkeypress="if(event.key==='Enter') searchMusic()">
            </div>
            <button class="btn-search" onclick="searchMusic()">Search</button>
        </div>

        <div class="genre-chips">
            <button class="chip active" onclick="loadQuery('Haryanvi Top')">Haryanvi</button>
            <button class="chip" onclick="loadQuery('Sidhu Moose Wala')">Sidhu Moose Wala</button>
            <button class="chip" onclick="loadQuery('Arijit Singh')">Arijit Singh</button>
            <button class="chip" onclick="loadQuery('Masoom Sharma')">Masoom Sharma</button>
            <button class="chip" onclick="loadQuery('Gulzaar Chhaniwala')">Gulzaar Chhaniwala</button>
        </div>

        <h2 id="sectionTitle">Loading songs...</h2>
        <div class="grid" id="songsGrid"></div>
    </div>

    <!-- Hidden Native Audio -->
    <audio id="audioEngine" preload="auto"></audio>

    <!-- Player Bar -->
    <div class="player-bar">
        <div class="current-track">
            <img id="currentCover" src="https://picsum.photos/100/100" alt="Track">
            <div class="track-info">
                <div class="track-name" id="currentTitle">DJ TILLU Player</div>
                <div class="artist-name" id="currentArtist">Select song to play</div>
            </div>
        </div>

        <div class="player-center">
            <div class="control-btns">
                <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
                <div class="play-toggle" onclick="togglePlay()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </div>
                <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" onchange="seekSong(this.value)">
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <span>● 100% Working Audio</span>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioEngine');
        let currentPlaylist = [];
        let currentIndex = 0;

        // Auto load on start
        window.onload = () => {
            loadQuery('Haryanvi Hits');
        };

        function searchMusic() {
            const val = document.getElementById('searchInput').value.trim();
            if (val) loadQuery(val);
        }

        function loadQuery(query) {
            document.getElementById('searchInput').value = query;
            document.getElementById('sectionTitle').innerText = `${query} Songs`;
            fetchSongs(query);
        }

        async function fetchSongs(query) {
            const grid = document.getElementById('songsGrid');
            grid.innerHTML = '<p style="color:#aaa;">Searching tracks...</p>';

            try {
                // High reliability direct endpoint
                const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}&page=1&limit=20`);
                const json = await res.json();
                const list = json.data?.results;

                if (!list || list.length === 0) {
                    fallbackSearch(query);
                    return;
                }

                currentPlaylist = list.map(item => {
                    const downloadUrls = item.downloadUrl || [];
                    const audio = downloadUrls.length > 0 ? downloadUrls[downloadUrls.length - 1].url : '';

                    const images = item.image || [];
                    const cover = images.length > 0 ? images[images.length - 1].url : 'https://picsum.photos/300/300';

                    let artist = 'Unknown';
                    if (item.artists?.primary?.length > 0) {
                        artist = item.artists.primary.map(a => a.name).join(', ');
                    }

                    return {
                        title: item.name.replace(/&quot;/g, '"').replace(/&#039;/g, "'"),
                        artist: artist,
                        cover: cover,
                        url: audio
                    };
                }).filter(song => song.url !== '');

                renderList(currentPlaylist);
            } catch (err) {
                fallbackSearch(query);
            }
        }

        async function fallbackSearch(query) {
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=20`);
                const data = await res.json();
                currentPlaylist = data.results.map(item => ({
                    title: item.trackName,
                    artist: item.artistName,
                    cover: item.artworkUrl100.replace('100x100bb', '300x300bb'),
                    url: item.previewUrl
                }));
                renderList(currentPlaylist);
            } catch (e) {
                document.getElementById('songsGrid').innerHTML = '<p style="color:red;">Error loading songs. Please check internet.</p>';
            }
        }

        function renderList(songs) {
            const grid = document.getElementById('songsGrid');
            grid.innerHTML = '';
            if (songs.length === 0) {
                grid.innerHTML = '<p style="color:#aaa;">No songs found.</p>';
                return;
            }

            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playSong(index);
                card.innerHTML = `
                    <img src="${song.cover}" alt="cover">
                    <div class="play-btn"><i class="fa-solid fa-play"></i></div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-artist">${song.artist}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playSong(index) {
            currentIndex = index;
            const song = currentPlaylist[index];
            if (!song) return;

            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;
            document.getElementById('currentCover').src = song.cover;

            audio.src = song.url;
            audio.load();
            audio.play().then(() => {
                document.getElementById('playIcon').className = 'fa-solid fa-pause';
            }).catch(err => {
                console.log("Audio play error", err);
            });
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                document.getElementById('playIcon').className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                document.getElementById('playIcon').className = 'fa-solid fa-play';
            }
        }

        function nextSong() {
            if (currentIndex < currentPlaylist.length - 1) {
                playSong(currentIndex + 1);
            } else {
                playSong(0);
            }
        }

        function prevSong() {
            if (currentIndex > 0) {
                playSong(currentIndex - 1);
            }
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const current = audio.currentTime;
                const total = audio.duration;
                document.getElementById('progressBar').value = (current / total) * 100;
                document.getElementById('currentTime').innerText = formatTime(current);
                document.getElementById('totalDuration').innerText = formatTime(total);
            }
        };

        function seekSong(val) {
            if (audio.duration) {
                audio.currentTime = (val / 100) * audio.duration;
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.onended = () => {
            nextSong();
        };
    </script>
</body>
</html>
