<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Circular', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 240px; background-color: #121212; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .logo { color: #fff; font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #1db954; font-size: 30px; }
        .nav-items { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
        .nav-item { color: #b3b3b3; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 16px; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: #fff; }

        /* Main Content */
        .main-content { flex: 1; background: linear-gradient(180deg, #222222 0%, #121212 100%); overflow-y: auto; padding: 20px 30px 100px 30px; }
        
        /* Topbar & Search */
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .search-bar { display: flex; align-items: center; background: #242424; border-radius: 500px; padding: 10px 16px; width: 350px; border: 1px solid transparent; }
        .search-bar:focus-within { border-color: #fff; }
        .search-bar input { background: transparent; border: none; outline: none; color: #fff; margin-left: 10px; width: 100%; font-size: 14px; }
        .search-btn { background: #1db954; border: none; color: #000; font-weight: bold; padding: 8px 16px; border-radius: 500px; cursor: pointer; transition: 0.2s; }
        .search-btn:hover { transform: scale(1.04); background: #1ed760; }

        /* Song Grid */
        h2 { font-size: 22px; margin-bottom: 16px; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        
        .card { background-color: #181818; padding: 16px; border-radius: 8px; transition: background-color 0.3s ease; position: relative; cursor: pointer; }
        .card:hover { background-color: #282828; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-artist { font-size: 13px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .play-btn { position: absolute; right: 24px; bottom: 80px; width: 44px; height: 44px; border-radius: 50%; background-color: #1db954; display: flex; justify-content: center; align-items: center; opacity: 0; transform: translateY(8px); transition: all 0.3s ease; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        .play-btn i { color: #000; font-size: 18px; margin-left: 2px; }
        .card:hover .play-btn { opacity: 1; transform: translateY(0); }

        /* Hidden YT Video Engine */
        #yt-player-container { position: absolute; top: -9999px; left: -9999px; }

        /* Bottom Player Bar */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; background-color: #181818; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .current-track { display: flex; align-items: center; gap: 14px; width: 25%; }
        .current-track img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; }
        .track-info .track-name { font-size: 14px; font-weight: 600; }
        .track-info .artist-name { font-size: 11px; color: #b3b3b3; margin-top: 4px; }

        .player-controls { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 50%; }
        .control-btns { display: flex; align-items: center; gap: 20px; }
        .control-btns i { color: #b3b3b3; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .control-btns i:hover { color: #fff; }
        .play-toggle { width: 34px; height: 34px; border-radius: 50%; background-color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .play-toggle i { color: #000 !important; font-size: 14px !important; }

        .extra-controls { width: 25%; display: flex; justify-content: flex-end; align-items: center; gap: 12px; color: #b3b3b3; }
        
        @media(max-width: 768px) {
            .sidebar { display: none; }
            .search-bar { width: 100%; }
            .player-bar { height: 75px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo"><i class="fa-brands fa-spotify"></i> Spotify</div>
        <div class="nav-items">
            <a href="#" class="nav-item active"><i class="fa-solid fa-house"></i> Home</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-compass"></i> Explore</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-layer-group"></i> Library</a>
        </div>
    </div>

    <!-- Main Section -->
    <div class="main-content">
        <!-- Top Search Bar -->
        <div class="topbar">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="color: #b3b3b3;"></i>
                <input type="text" id="customInput" placeholder="Paste YouTube link or Song ID...">
            </div>
            <button class="search-btn" onclick="playFromInput()">Play Track</button>
        </div>

        <h2>Popular Tracks</h2>
        <div class="grid" id="songsGrid"></div>
    </div>

    <!-- Hidden Engine -->
    <div id="yt-player-container"><div id="yt-engine"></div></div>

    <!-- Bottom Player -->
    <div class="player-bar">
        <div class="current-track">
            <img id="currentCover" src="https://picsum.photos/200/200?random=1" alt="Track">
            <div class="track-info">
                <div class="track-name" id="currentTitle">Select a track</div>
                <div class="artist-name" id="currentArtist">Spotify Clone</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
                <div class="play-toggle" onclick="togglePlay()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </div>
                <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
            </div>
        </div>

        <div class="extra-controls">
            <i class="fa-solid fa-volume-high"></i>
        </div>
    </div>

    <!-- YouTube API Script -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const songs = [
            { id: "kJQP7kiw5Fk", title: "Despacito", artist: "Luis Fonsi, Daddy Yankee", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" },
            { id: "JGwWNGJdvx8", title: "Shape of You", artist: "Ed Sheeran", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" },
            { id: "fJ9rUzIMcZQ", title: "Bohemian Rhapsody", artist: "Queen", cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300" },
            { id: "kXYiU_JCYtU", title: "Numb", artist: "Linkin Park", cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=300" },
            { id: "YQHsXMglC9A", title: "Hello", artist: "Adele", cover: "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=300" },
            { id: "09R8_2nJtjg", title: "Sugar", artist: "Maroon 5", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300" }
        ];

        let currentIndex = 0;
        let player;
        let isPlaying = false;

        // Render Cards dynamically
        const grid = document.getElementById('songsGrid');
        songs.forEach((song, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => loadTrack(index);
            card.innerHTML = `
                <img src="${song.cover}" alt="${song.title}">
                <div class="play-btn"><i class="fa-solid fa-play"></i></div>
                <div class="card-title">${song.title}</div>
                <div class="card-artist">${song.artist}</div>
            `;
            grid.appendChild(card);
        });

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-engine', {
                height: '200',
                width: '200',
                videoId: songs[0].id,
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: {
                    'onStateChange': (e) => {
                        const playIcon = document.getElementById('playIcon');
                        if (e.data === YT.PlayerState.PLAYING) {
                            isPlaying = true;
                            playIcon.className = "fa-solid fa-pause";
                        } else {
                            isPlaying = false;
                            playIcon.className = "fa-solid fa-play";
                        }
                    }
                }
            });
        }

        function loadTrack(index) {
            currentIndex = index;
            const song = songs[index];
            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;
            document.getElementById('currentCover').src = song.cover;
            
            if (player && player.loadVideoById) {
                player.loadVideoById(song.id);
            }
        }

        function togglePlay() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % songs.length;
            loadTrack(currentIndex);
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadTrack(currentIndex);
        }

        function playFromInput() {
            const val = document.getElementById('customInput').value.trim();
            if (!val) return;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = val.match(regExp);
            const videoId = (match && match[2].length === 11) ? match[2] : val;

            document.getElementById('currentTitle').innerText = "Playing Custom Track";
            document.getElementById('currentArtist').innerText = "YouTube";
            player.loadVideoById(videoId);
            document.getElementById('customInput').value = '';
        }
    </script>
</body>
</html>
