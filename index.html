<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify India - Web Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Circular', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 230px; background-color: #121212; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
        .logo { color: #fff; font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .logo i { color: #1db954; font-size: 28px; }
        .nav-items { display: flex; flex-direction: column; gap: 16px; }
        .nav-item { color: #b3b3b3; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { color: #fff; }

        /* Main Content */
        .main-content { flex: 1; background: linear-gradient(180deg, #202020 0%, #121212 100%); overflow-y: auto; padding: 20px 30px 120px 30px; }
        
        .topbar { display: flex; gap: 12px; margin-bottom: 24px; }
        .search-box { display: flex; align-items: center; background: #242424; border-radius: 500px; padding: 10px 18px; width: 100%; max-width: 420px; border: 1px solid transparent; }
        .search-box:focus-within { border-color: #fff; }
        .search-box input { background: transparent; border: none; outline: none; color: #fff; margin-left: 10px; width: 100%; font-size: 14px; }
        .btn-search { background: #1db954; border: none; color: #000; font-weight: bold; padding: 10px 22px; border-radius: 500px; cursor: pointer; transition: 0.2s; }
        .btn-search:hover { transform: scale(1.04); background: #1ed760; }

        .genre-chips { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 5px; }
        .chip { background: #2a2a2a; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; white-space: nowrap; }
        .chip:hover, .chip.active { background: #fff; color: #000; }

        h2 { font-size: 22px; margin-bottom: 16px; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        
        .card { background-color: #181818; padding: 16px; border-radius: 8px; cursor: pointer; transition: background-color 0.3s; position: relative; }
        .card:hover { background-color: #282828; }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; margin-bottom: 12px; }
        .card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-artist { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .play-btn { position: absolute; right: 24px; bottom: 75px; width: 44px; height: 44px; border-radius: 50%; background-color: #1db954; display: flex; justify-content: center; align-items: center; opacity: 0; transform: translateY(6px); transition: 0.2s; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .play-btn i { color: #000; font-size: 16px; margin-left: 2px; }
        .card:hover .play-btn { opacity: 1; transform: translateY(0); }

        /* Hidden YT Background Player */
        #yt-player-container { position: absolute; top: -9999px; left: -9999px; }

        /* Bottom Player Bar */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 90px; background-color: #181818; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; }
        
        .current-track { display: flex; align-items: center; gap: 14px; width: 30%; }
        .current-track img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; }
        .track-info .track-name { font-size: 14px; font-weight: 600; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info .artist-name { font-size: 12px; color: #b3b3b3; margin-top: 2px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 40%; }
        .control-btns { display: flex; align-items: center; gap: 20px; }
        .control-btns i { color: #b3b3b3; font-size: 18px; cursor: pointer; transition: 0.2s; }
        .control-btns i:hover { color: #fff; }
        .play-toggle { width: 36px; height: 36px; border-radius: 50%; background-color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .play-toggle i { color: #000 !important; font-size: 14px !important; }

        .progress-container { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: #a7a7a7; }
        .progress-bar { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #4d4d4d; outline: none; cursor: pointer; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; }

        .extra-controls { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 12px; color: #b3b3b3; }

        @media(max-width: 768px) {
            .sidebar { display: none; }
            .player-bar { height: 75px; padding: 0 12px; }
            .extra-controls { display: none; }
            .current-track { width: 50%; }
            .player-center { width: 50%; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo"><i class="fa-brands fa-spotify"></i> Spotify</div>
        <div class="nav-items">
            <div class="nav-item active" onclick="loadCategory('Indian Top Hits')"><i class="fa-solid fa-house"></i> Home</div>
            <div class="nav-item" onclick="loadCategory('Bollywood Romantic')"><i class="fa-solid fa-heart"></i> Bollywood</div>
            <div class="nav-item" onclick="loadCategory('Punjabi Hits')"><i class="fa-solid fa-fire"></i> Punjabi</div>
            <div class="nav-item" onclick="loadCategory('Haryanvi Hits')"><i class="fa-solid fa-music"></i> Haryanvi</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Search Bar -->
        <div class="topbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color: #b3b3b3;"></i>
                <input type="text" id="searchInput" placeholder="Search any Hindi, Punjabi, Haryanvi song or Artist..." onkeypress="handleKey(event)">
            </div>
            <button class="btn-search" onclick="searchMusic()">Search</button>
        </div>

        <!-- Quick Categories -->
        <div class="genre-chips">
            <button class="chip active" onclick="loadCategory('Indian Trending')">Trending India</button>
            <button class="chip" onclick="loadCategory('Arijit Singh')">Arijit Singh</button>
            <button class="chip" onclick="loadCategory('Sidhu Moose Wala')">Sidhu Moose Wala</button>
            <button class="chip" onclick="loadCategory('Masoom Sharma')">Haryanvi Rap</button>
            <button class="chip" onclick="loadCategory('Yo Yo Honey Singh')">Honey Singh</button>
        </div>

        <h2 id="sectionTitle">Trending in India</h2>
        <div class="grid" id="songsGrid"></div>
    </div>

    <!-- Background YouTube Engine -->
    <div id="yt-player-container"><div id="yt-engine"></div></div>

    <!-- Bottom Player -->
    <div class="player-bar">
        <div class="current-track">
            <img id="currentCover" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" alt="Track">
            <div class="track-info">
                <div class="track-name" id="currentTitle">Select a track</div>
                <div class="artist-name" id="currentArtist">Spotify Music Engine</div>
            </div>
        </div>

        <div class="player-center">
            <div class="control-btns">
                <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
                <div class="play-toggle" onclick="togglePlay()">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </div>
                <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100" onchange="seekSong(this.value)">
                <span id="totalDuration">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <i class="fa-solid fa-volume-high"></i>
        </div>
    </div>

    <!-- YouTube API Engine -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Preset Indian Trending Playlist
        let currentPlaylist = [
            { id: "T1e0U2qfS44", title: "O Maahi", artist: "Arijit Singh", cover: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300" },
            { id: "kXYiU_JCYtU", title: "295", artist: "Sidhu Moose Wala", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300" },
            { id: "JGwWNGJdvx8", title: "Chaleya", artist: "Arijit Singh, Anirudh", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300" },
            { id: "09R8_2nJtjg", title: "Desi Kalakaar", artist: "Yo Yo Honey Singh", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300" },
            { id: "fJ9rUzIMcZQ", title: "Goli Mare Tera Baap", artist: "Haryanvi Hits", cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=300" }
        ];

        let currentIndex = 0;
        let player;
        let isPlaying = false;
        let progressInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-engine', {
                height: '100',
                width: '100',
                videoId: currentPlaylist[0].id,
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
            renderGrid(currentPlaylist);
        }

        function renderGrid(songs) {
            const grid = document.getElementById('songsGrid');
            grid.innerHTML = '';
            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playSong(index);
                card.innerHTML = `
                    <img src="${song.cover}" alt="${song.title}">
                    <div class="play-btn"><i class="fa-solid fa-play"></i></div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-artist">${song.artist}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playSong(index) {
            currentIndex = index;
            const song = currentPlaylist[index];

            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;
            document.getElementById('currentCover').src = song.cover;

            if (player && player.loadVideoById) {
                player.loadVideoById(song.id);
            }
        }

        function togglePlay() {
            if (!player) return;
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function nextSong() {
            if (currentIndex < currentPlaylist.length - 1) {
                playSong(currentIndex + 1);
            } else {
                playSong(0); // Repeat list
            }
        }

        function prevSong() {
            if (currentIndex > 0) {
                playSong(currentIndex - 1);
            }
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('playIcon');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                startProgressBar();
            } else {
                isPlaying = false;
                playIcon.className = "fa-solid fa-play";
                clearInterval(progressInterval);
            }

            // Auto Next Song when track ends
            if (event.data === YT.PlayerState.ENDED) {
                nextSong();
            }
        }

        function startProgressBar() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime) {
                    const current = player.getCurrentTime();
                    const total = player.getDuration();
                    if (total > 0) {
                        document.getElementById('progressBar').value = (current / total) * 100;
                        document.getElementById('currentTime').innerText = formatTime(current);
                        document.getElementById('totalDuration').innerText = formatTime(total);
                    }
                }
            }, 1000);
        }

        function seekSong(value) {
            if (player && player.getDuration) {
                const seekToTime = (value / 100) * player.getDuration();
                player.seekTo(seekToTime, true);
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function handleKey(e) {
            if (e.key === 'Enter') searchMusic();
        }

        // Live Dynamic Search via Invidious / iTunes metadata
        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('sectionTitle').innerText = `Results for "${query}"`;
            document.getElementById('songsGrid').innerHTML = '<p style="color:#aaa;">Searching tracks...</p>';

            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=15`);
                const data = await res.json();

                if (data.results.length === 0) {
                    document.getElementById('songsGrid').innerHTML = '<p style="color:#aaa;">No songs found.</p>';
                    return;
                }

                currentPlaylist = data.results.map(item => ({
                    id: item.trackName, // Will fallback to instant preview/search
                    title: item.trackName,
                    artist: item.artistName,
                    cover: item.artworkUrl100.replace('100x100bb', '400x400bb'),
                    previewUrl: item.previewUrl
                }));

                renderGrid(currentPlaylist);
            } catch (err) {
                document.getElementById('songsGrid').innerHTML = '<p style="color:red;">Error loading tracks.</p>';
            }
        }

        function loadCategory(cat) {
            document.getElementById('searchInput').value = cat;
            searchMusic();
        }
    </script>
</body>
</html>
