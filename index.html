<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TILLU - Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d0d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .player-card { background: #181818; width: 100%; max-width: 380px; border-radius: 20px; padding: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); border: 1px solid #282828; text-align: center; }
        
        .logo { color: #ff0055; font-size: 20px; font-weight: 900; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logo i { color: #1db954; }

        .cover-container { width: 100%; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden; margin-bottom: 20px; background: #000; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .cover-container img { width: 100%; height: 100%; object-fit: cover; }

        .song-info { margin-bottom: 20px; }
        .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist { font-size: 13px; color: #b3b3b3; }

        /* Custom Audio Controller */
        .controls { display: flex; justify-content: center; align-items: center; gap: 24px; margin-bottom: 20px; }
        .controls i { font-size: 22px; color: #b3b3b3; cursor: pointer; transition: 0.2s; }
        .controls i:hover { color: #fff; }
        
        .play-btn { width: 55px; height: 55px; border-radius: 50%; background: #ff0055; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); transition: 0.2s; }
        .play-btn:hover { transform: scale(1.05); background: #e6004c; }
        .play-btn i { color: #fff !important; font-size: 20px !important; margin-left: 2px; }

        /* Playlist Section */
        .playlist { text-align: left; background: #121212; border-radius: 12px; max-height: 180px; overflow-y: auto; border: 1px solid #222; }
        .playlist-item { padding: 12px 14px; border-bottom: 1px solid #222; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .playlist-item:hover { background: #222; color: #ff0055; }
        .playlist-item.active { background: #222; color: #ff0055; font-weight: bold; border-left: 4px solid #ff0055; }
        .playlist-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="logo"><i class="fa-solid fa-compact-disc"></i> DJ TILLU</div>

        <div class="cover-container">
            <img id="coverImg" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400" alt="Cover">
        </div>

        <div class="song-info">
            <div class="title" id="songTitle">Select a Song</div>
            <div class="artist" id="songArtist">DJ TILLU Production</div>
        </div>

        <div class="controls">
            <i class="fa-solid fa-backward-step" onclick="prevSong()"></i>
            <div class="play-btn" onclick="togglePlay()">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </div>
            <i class="fa-solid fa-forward-step" onclick="nextSong()"></i>
        </div>

        <div class="playlist" id="playlistBox">
            <!-- Items dynamically added -->
        </div>
    </div>

    <!-- Hidden Native Audio Engine -->
    <audio id="audioEngine"></audio>

    <script>
        const playlist = [
            {
                title: "Gypsy (Balam Thanedhar)",
                artist: "GD Kaur, Pranjal Dahiya",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                title: "Kaleshi Chori",
                artist: "DG Immortals, Raga",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                title: "295 - Sidhu Moose Wala",
                artist: "Sidhu Moose Wala",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            },
            {
                title: "Desi Kalakaar",
                artist: "Yo Yo Honey Singh",
                cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
            }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audioEngine');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const coverImg = document.getElementById('coverImg');
        const playIcon = document.getElementById('playIcon');
        const playlistBox = document.getElementById('playlistBox');

        // Render Playlist UI
        function renderPlaylist() {
            playlistBox.innerHTML = '';
            playlist.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
                div.innerHTML = `<span>${index + 1}. ${song.title}</span> <i class="fa-solid fa-play" style="font-size:10px;"></i>`;
                div.onclick = () => {
                    currentIndex = index;
                    playSong();
                };
                playlistBox.appendChild(div);
            });
        }

        function playSong() {
            const song = playlist[currentIndex];
            songTitle.innerText = song.title;
            songArtist.innerText = song.artist;
            coverImg.src = song.cover;

            audio.src = song.url;
            audio.load();
            audio.play().then(() => {
                playIcon.className = "fa-solid fa-pause";
                renderPlaylist();
            }).catch(e => {
                console.log("Playback blocked or failed", e);
            });
        }

        function togglePlay() {
            if (!audio.src) {
                playSong();
                return;
            }
            if (audio.paused) {
                audio.play();
                playIcon.className = "fa-solid fa-pause";
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-play";
            }
        }

        function nextSong() {
            currentIndex = (currentIndex + 1) % playlist.length;
            playSong();
        }

        function prevSong() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            playSong();
        }

        audio.onended = () => {
            nextSong();
        };

        // Initialize first song on load view
        window.onload = () => {
            renderPlaylist();
            songTitle.innerText = playlist[0].title;
            songArtist.innerText = playlist[0].artist;
            coverImg.src = playlist[0].cover;
            audio.src = playlist[0].url;
        };
    </script>
</body>
</html>
