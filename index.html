<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 30px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; max-width: 320px; margin: auto; }
        audio { width: 100%; margin-top: 15px; }
        img { width: 100%; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://picsum.photos/300/300" alt="Cover">
        <h2>Demo Song</h2>
        <p style="color: #aaa;">Online Stream</p>
        
        <!-- Online Song Link -->
        <audio controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
            Your browser does not support the audio tag.
        </audio>
    </div>

</body>
</html>
