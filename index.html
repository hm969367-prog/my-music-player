<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ TILLU - Live Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d0d; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .player-card { background: #181818; width: 100%; max-width: 380px; border-radius: 20px; padding: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); border: 1px solid #282828; text-align: center; }
        
        .logo { color: #ff0055; font-size: 22px; font-weight: 900; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logo i { color: #1db954; }

        .visualizer { width: 100%; height: 180px; border-radius: 14px; overflow: hidden; margin-bottom: 20px; background: #111; display: flex; justify-content: center; align-items: center; border: 1px solid #333; position: relative; }
        .disc { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #ff0055 20%, #111 21%, #111 40%, #ff0055 41%, #222 60%); border: 3px solid #ff0055; display: flex; justify-content: center; align-items: center; }
        .spin { animation: rotateDisc 2.5s linear infinite; }
        @keyframes rotateDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .song-info { margin-bottom: 20px; }
        .title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .artist { font-size: 13px; color: #b3b3b3; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 24px; margin-bottom: 20px; }
        .controls i { font-size: 22px; color: #b3b3b3; cursor: pointer; transition: 0.2s; }
        .controls i:hover { color: #fff; }
        
        .play-btn { width: 55px; height: 55px; border-radius: 50%; background: #ff0055; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4); }
        .play-btn i { color: #fff !important; font-size: 20px !important; margin-left: 2px; }

        .playlist { text-align: left; background: #121212; border-radius: 12px; border: 1px solid #222; }
        .playlist-item { padding: 12px 14px; border-bottom: 1px solid #222; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .playlist-item:hover, .playlist-item.active { background: #222; color: #ff0055; font-weight: bold; }
        .playlist-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="logo"><i class="fa-solid fa-compact-disc"></i> DJ TILLU</div>

        <div class="visualizer">
            <div class="disc" id="discIcon">
                <i class="fa-solid fa-music" style="color:#fff; font-size: 24px;"></i>
            </div>
        </div>

        <div class="song-info">
            <div class="title" id="songTitle">Haryanvi Bass Beat</div>
            <div class="artist" id="songArtist">DJ TILLU Mix</div>
        </div>

        <div class="controls">
            <i class="fa-solid fa-backward-step" onclick="prevTrack()"></i>
            <div class="play-btn" onclick="toggleAudio()">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </div>
            <i class="fa-solid fa-forward-step" onclick="nextTrack()"></i>
        </div>

        <div class="playlist">
            <div class="playlist-item active" onclick="selectTrack(0)">1. Haryanvi Bass Beat <span>▶</span></div>
            <div class="playlist-item" onclick="selectTrack(1)">2. Punjabi Dhol Beat <span>▶</span></div>
            <div class="playlist-item" onclick="selectTrack(2)">3. Tillu Special Drop <span>▶</span></div>
        </div>
    </div>

    <script>
        const tracks = [
            { title: "Haryanvi Bass Beat", artist: "DJ TILLU Mix", freq: 160 },
            { title: "Punjabi Dhol Beat", artist: "DJ TILLU Mix", freq: 220 },
            { title: "Tillu Special Drop", artist: "DJ TILLU Mix", freq: 280 }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSynthesizedTrack(freq) {
            initAudioEngine();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            stopSynthesizedTrack();

            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Pulse effect to mimic beats
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            isPlaying = true;
            document.getElementById('playIcon').className = "fa-solid fa-pause";
            document.getElementById('discIcon').classList.add('spin');
        }

        function stopSynthesizedTrack() {
            if (oscillator) {
                try {
                    oscillator.stop();
                    oscillator.disconnect();
                } catch(e) {}
                oscillator = null;
            }
            isPlaying = false;
            document.getElementById('playIcon').className = "fa-solid fa-play";
            document.getElementById('discIcon').classList.remove('spin');
        }

        function toggleAudio() {
            if (isPlaying) {
                stopSynthesizedTrack();
            } else {
                playSynthesizedTrack(tracks[currentIndex].freq);
            }
        }

        function selectTrack(index) {
            currentIndex = index;
            document.getElementById('songTitle').innerText = tracks[index].title;
            document.getElementById('songArtist').innerText = tracks[index].artist;

            const items = document.querySelectorAll('.playlist-item');
            items.forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            playSynthesizedTrack(tracks[index].freq);
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % tracks.length;
            selectTrack(currentIndex);
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            selectTrack(currentIndex);
        }
    </script>
</body>
</html>
